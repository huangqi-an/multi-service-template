# ─────────────────────────────────────────────────────────────────────
# 总入口
#
# 本文件不含任何服务定义，只用 include 把各服务的 compose.yml 聚合起来。
#   - 在仓库根目录一条命令起停全部服务：docker compose up -d / down
#   - 每个服务仍保留自己的 compose.yml，可独立维护、独立回滚
# ─────────────────────────────────────────────────────────────────────

include:
  # ↑ include 是 Compose v2.20+ 的特性：
  #   把指定文件里的服务"合并进当前项目"，而不是当作独立项目另起一套。
  #   路径相对于本文件所在目录。
  #
  #   合并后的效果：
  #   - 所有服务同属一个项目（项目名默认取目录名，换目录或改名后自动跟随）
  #   - docker compose ps / logs / down 一次覆盖全部服务
  #   - 服务之间的依赖与网络关系在同一项目内可见

  - ./nginx/compose.yml
  - ./services/hello-api/compose.yml
  - ./services/postgres/compose.yml
  - ./services/redis/compose.yml
  # ↑ 一个服务一行。compose 不保证 include 的加载顺序，
  #   但按"入口 → 业务 → 数据"排列，读起来更清楚。

  # 新服务接入后在此追加：
  # - ./services/<service-name>/compose.yml
  #
  # 注意：不要 include services/_template —— 它是模板，不是可运行服务。

# ─────────────────────────────────────────────────────────────────────
# 关于"在哪执行 docker compose"
#
# 各服务都固定了 container_name（例如 nginx），这是为了给反代提供稳定的
# DNS 名。副作用是：同一个服务不能在两个 compose 项目里各起一份，否则
# 容器名冲突，第二个 up 会直接报错。
#
# 所以约定：
#   - 日常运维统一在仓库根目录执行；
#   - 需要单独调试某个服务时，先 docker compose down 掉根项目，再进子目录操作。
# ─────────────────────────────────────────────────────────────────────
