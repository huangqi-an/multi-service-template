# ─────────────────────────────────────────────────────────────────────
# Redis 受限配置：兑现架构文档 §7 给它的 128M 预算
# 挂载到容器的 /usr/local/etc/redis/redis.conf（只读）
# ─────────────────────────────────────────────────────────────────────

# 内存上限。容器 mem_limit 是 128m，这里留约 32M 余量给 Redis 自身开销
# （客户端缓冲、内存碎片等），避免先撞容器硬上限被 OOM kill。
maxmemory 96mb

# 达到上限后的淘汰策略：
#   allkeys-lru —— 在所有键中淘汰最近最少使用的，适合纯缓存场景
# 若把 Redis 当持久存储用（数据丢了不可接受），应改成 noeviction，
# 让写操作直接报错，而不是静默淘汰掉数据。
maxmemory-policy allkeys-lru

# 持久化：只开 RDB 快照。
# 15 分钟内至少 1 次写、或 5 分钟内至少 10 次写，就落一次盘。
# 不开 AOF：学习环境不需要秒级持久化，AOF 会额外占磁盘并带来写放大。
save 900 1
save 300 10
appendonly no

# 数据目录，对应 compose 里的挂载点
dir /data

loglevel notice
