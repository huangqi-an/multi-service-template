# ─────────────────────────────────────────────────────────────────────
# 入口层路由表
#
# 本文件挂载到容器的 /etc/nginx/conf.d/*.conf（只读），
# nginx.conf 里有一行 include /etc/nginx/conf.d/*.conf; 会把这里的 server 块加载进去。
#
# 改完执行：
#   docker compose exec nginx nginx -s reload      # 热加载，不断连接
#   docker compose exec nginx nginx -t             # 先校验语法更稳妥
# ─────────────────────────────────────────────────────────────────────

server {
    # ↑ server 块 = 一个虚拟主机（一个站点的配置）。
    #   本文件只有一个 server，路径匹配规则也都在它内部。

    listen 80;
    # ↑ 容器内部监听 80 端口。
    #   注意这是"容器里的 80"，外面看到的是 compose 里的端口映射
    #   ${NGINX_PORT:-80}:80，两者是两件事。

    server_name _;
    # ↑ 匹配请求头里的 Host。_ 是"匹配不到任何真实域名"的惯例占位符，
    #   效果是：不管用 IP 访问还是随便什么域名指向它，都由这个 server 处理。
    #   以后接入域名时，这里改成实际域名（可写多个，用空格分隔）。

    charset utf-8;
    # ↑ 让响应头 Content-Type 带上 charset=utf-8。
    #   不加的话中文可能显示成乱码——浏览器只能靠这个声明猜编码。

    server_tokens off;
    # ↑ 响应头 Server 只回 "nginx"，不暴露具体版本号。
    #   少给扫描器一点信息，属于低成本的安全习惯。

    # ── 健康检查端点 ──────────────────────────────────────────────
    location = /healthz {
        # ↑ location = 是"精确匹配"：只有 URI 恰好等于 /healthz 才命中，
        #   /healthz/、/healthz?x=1 都不算。
        #   精确匹配优先级最高，会压过所有前缀匹配，适合这种固定端点。
        #   对应 compose.yml 里 healthcheck 探测的地址，改一处要同步改另一处。

        access_log off;
        # ↑ 关掉这个 location 的访问日志。
        #   healthcheck 每 30 秒打一次，不关的话日志里全是它，
        #   真正有用的请求反而被淹没。

        default_type text/plain;
        # ↑ 指定响应的 MIME 类型。
        #   配合上面的 charset utf-8，最终响应头是
        #   Content-Type: text/plain; charset=utf-8

        return 200 "ok\n";
        # ↑ 直接返回状态码和内容，不去磁盘找文件。
        #   最后那个 \n 会输出成真正的换行，curl 看起来更整齐。
    }

    # ── 根路径占位响应 ────────────────────────────────────────────
    location = / {
        # ↑ 同样是精确匹配，只处理"/"本身，不影响其他路径。
        #   接入业务服务后，这里通常改成前缀匹配 location / { ... }。

        default_type text/plain;
        return 200 "入口层就绪，等待接入业务服务\n";
    }

    # ── hello-api 业务服务 ────────────────────────────────────────
    location /hello/ {
        # ↑ 前缀匹配：/hello/、/hello/abc 都会命中。
        #   末尾斜杠不能省，否则 /hello/abc 也会被这个块吃掉。

        proxy_pass http://hello-api:8000/;
        # ↑ 末尾带斜杠 = 把 location 匹配到的 /hello/ 前缀替换成 /，
        #   所以 /hello/a 到后端变成 /a，/hello/ 变成 /。
        #   去掉这个斜杠，后端会收到带 /hello 前缀的路径，FastAPI 就没有对应路由了。

        proxy_set_header Host $host;
        # ↑ 把客户端原始 Host 传给后端，而不是默认的上游地址。

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ↑ 后端拿到的来源 IP 本来是 nginx 容器的 IP，
        #   这两个头把真实客户端 IP 带过去，日志和限流才有意义。

        proxy_set_header X-Forwarded-Proto $scheme;
        # ↑ 告诉后端原始请求是 http 还是 https，以后上 TLS 时不用再改。
    }

    location = /hello {
        # ↑ 少写一个斜杠的常见情况：/hello 不匹配上面的 /hello/，
        #   这里直接 301 补上斜杠，省得用户看到 404。
        return 301 /hello/;
    }


    # 没被任何 location 匹配到的路径，由 nginx 默认返回 404，
    # 所以 /nope 之类不会落到"根路径占位"上。
}

# ─────────────────────────────────────────────────────────────────────
# 后续接入业务服务时，在上面的 server 块内追加 location，例如：
#
#   location /hello/ {
#       proxy_pass http://hello-api:8000/;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#   }
#
# 三个最容易踩的坑：
#
# 1) 上游写"容器名"，不要写 IP
#    容器重建后 IP 会变，容器名不变。nginx 启动时做一次 DNS 解析，
#    所以 hello-api 必须已经在 web-net 上存在，否则 nginx 直接启动失败
#    （报 host not found in upstream）。多个服务互相依赖时注意启动顺序。
#
# 2) proxy_pass 末尾有没有斜杠，转发路径完全不同
#      location /hello/ { proxy_pass http://hello-api:8000/;  }   # /hello/a → /a
#      location /hello/ { proxy_pass http://hello-api:8000;   }   # /hello/a → /hello/a
#    带斜杠 = 把 location 匹配到的那段前缀替换掉；不带 = 原样透传。
#    少写一个斜杠导致后端 404，是最常见的排查耗时点。
#
# 3) $host、$remote_addr 是 nginx 内置变量
#    本文件是"挂载进容器"的，不经过 compose 处理，所以照写 $ 即可。
#    但如果哪天把 nginx 配置直接写进 compose.yml，$ 必须写成 $$，
#    否则会被 compose 的变量插值先吃掉，变成空字符串。
# ─────────────────────────────────────────────────────────────────────
